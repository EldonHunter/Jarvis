
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --cyan: #00e5ff;
    --blue: #1565c0;
    --dark: #020812;
    --panel: rgba(0,229,255,0.04);
    --border: rgba(0,229,255,0.2);
    --glow: 0 0 20px rgba(0,229,255,0.4);
    --glow-strong: 0 0 40px rgba(0,229,255,0.7);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    font-family: 'Rajdhani', sans-serif;
    color: var(--cyan);
    height: 100vh;
    overflow: hidden;
    cursor: crosshair;
    user-select: none;
  }

  /* SCANLINE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,229,255,0.015) 2px,
      rgba(0,229,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* GRID BACKGROUND */
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridPulse 8s ease-in-out infinite;
  }

  @keyframes gridPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* CORNER DECORATIONS */
  .corner {
    position: fixed;
    width: 80px;
    height: 80px;
    z-index: 10;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--cyan);
    box-shadow: var(--glow);
  }
  .corner::before { width: 2px; height: 40px; }
  .corner::after  { width: 40px; height: 2px; }
  .corner-tl { top: 20px; left: 20px; }
  .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
  .corner-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
  .corner-br { bottom: 20px; right: 20px; transform: scale(-1); }

  /* HEADER */
  .header {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 50;
  }
  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.2rem, 4vw, 2.2rem);
    font-weight: 900;
    letter-spacing: 0.6em;
    color: var(--cyan);
    text-shadow: var(--glow-strong);
    animation: titleFlicker 6s ease-in-out infinite;
  }
  .header .subtitle {
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    opacity: 0.5;
    margin-top: 4px;
    text-transform: uppercase;
  }

  @keyframes titleFlicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.6; }
    97% { opacity: 1; }
    98% { opacity: 0.4; }
    99% { opacity: 1; }
  }

  /* STATUS BAR */
  .status-bar {
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    opacity: 0.6;
    z-index: 50;
  }
  .status-item { display: flex; align-items: center; gap: 6px; }
  .status-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--cyan);
    animation: blink 2s ease-in-out infinite;
  }
  .status-dot.red { background: #ff3d71; animation-delay: 0.5s; }
  .status-dot.green { background: #00e676; animation-delay: 1s; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* MAIN CIRCLE CONTAINER */
  .center-stage {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* OUTER RINGS */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,229,255,0.15);
  }
  .ring-1 { width: 420px; height: 420px; animation: rotateRing 20s linear infinite; }
  .ring-2 { width: 360px; height: 360px; animation: rotateRing 15s linear infinite reverse; }
  .ring-3 { width: 300px; height: 300px; animation: rotateRing 25s linear infinite; border-style: dashed; }

  .ring-1::before, .ring-1::after,
  .ring-2::before {
    content: '';
    position: absolute;
    width: 8px; height: 8px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: var(--glow-strong);
    top: -4px; left: 50%;
    transform: translateX(-50%);
  }
  .ring-1::after { top: auto; bottom: -4px; }
  .ring-2::before { left: -4px; top: 50%; transform: translateY(-50%); }

  @keyframes rotateRing {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* MAIN CIRCLE */
  .main-circle {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 30% 30%,
      rgba(0,229,255,0.12),
      rgba(21,101,192,0.08),
      rgba(2,8,18,0.9)
    );
    border: 2px solid rgba(0,229,255,0.5);
    box-shadow:
      0 0 30px rgba(0,229,255,0.3),
      0 0 60px rgba(0,229,255,0.15),
      0 0 120px rgba(0,229,255,0.08),
      inset 0 0 30px rgba(0,229,255,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .main-circle.listening {
    border-color: var(--cyan);
    box-shadow:
      0 0 40px rgba(0,229,255,0.6),
      0 0 80px rgba(0,229,255,0.3),
      0 0 150px rgba(0,229,255,0.15),
      inset 0 0 40px rgba(0,229,255,0.1);
    animation: pulseCircle 1.5s ease-in-out infinite;
  }

  .main-circle.processing {
    border-color: #ffd600;
    box-shadow:
      0 0 40px rgba(255,214,0,0.5),
      0 0 80px rgba(255,214,0,0.2),
      inset 0 0 30px rgba(255,214,0,0.08);
  }

  .main-circle.speaking {
    border-color: #00e676;
    box-shadow:
      0 0 40px rgba(0,230,118,0.5),
      0 0 80px rgba(0,230,118,0.2),
      inset 0 0 30px rgba(0,230,118,0.08);
  }

  @keyframes pulseCircle {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  .arc-decor {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid transparent;
    border-top-color: var(--cyan);
    border-right-color: var(--cyan);
    opacity: 0.4;
    animation: rotateRing 3s linear infinite;
  }

  .circle-icon {
    font-size: 2.5rem;
    filter: drop-shadow(0 0 10px var(--cyan));
    transition: all 0.3s;
  }

  .circle-state-text {
    font-family: 'Orbitron', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.3em;
    opacity: 0.7;
    text-transform: uppercase;
  }

  /* WAVEFORM */
  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 30px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .waveform.active { opacity: 1; }
  .wave-bar {
    width: 3px;
    background: var(--cyan);
    border-radius: 2px;
    min-height: 4px;
    animation: waveDance 0.8s ease-in-out infinite;
    box-shadow: 0 0 6px var(--cyan);
  }
  .wave-bar:nth-child(1) { animation-delay: 0.0s; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.15s; }
  .wave-bar:nth-child(6) { animation-delay: 0.05s; }
  .wave-bar:nth-child(7) { animation-delay: 0.25s; }

  @keyframes waveDance {
    0%, 100% { height: 4px; }
    50% { height: 24px; }
  }

  /* SIDE PANELS */
  .side-panel {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 200px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 20;
  }
  .side-panel.left { left: 30px; }
  .side-panel.right { right: 30px; align-items: flex-end; }

  .panel-block {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 14px;
    position: relative;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  }
  .panel-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 40%;
    height: 1px;
    background: var(--cyan);
    box-shadow: var(--glow);
  }
  .panel-label {
    font-size: 0.5rem;
    letter-spacing: 0.25em;
    opacity: 0.5;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .panel-value {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    text-shadow: var(--glow);
  }

  /* TRANSCRIPT */
  .transcript-area {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: min(600px, 90vw);
    text-align: center;
    z-index: 50;
  }
  .transcript-label {
    font-size: 0.5rem;
    letter-spacing: 0.3em;
    opacity: 0.4;
    margin-bottom: 8px;
  }
  .transcript-text {
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.6rem, 2vw, 0.85rem);
    letter-spacing: 0.1em;
    min-height: 24px;
    color: var(--cyan);
    text-shadow: var(--glow);
    transition: all 0.3s;
    word-break: break-word;
  }
  .transcript-text.response {
    color: #00e676;
    text-shadow: 0 0 20px rgba(0,230,118,0.6);
  }

  /* RESPONSE BOX */
  .response-box {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    width: min(600px, 90vw);
    background: rgba(0,229,255,0.04);
    border: 1px solid var(--border);
    padding: 14px 18px;
    font-size: 0.75rem;
    line-height: 1.6;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 0.5s;
    display: none;
    text-align: center;
  }
  .response-box.visible {
    opacity: 1;
    display: block;
  }

  /* MAP PANEL */
  .map-panel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    width: min(700px, 92vw);
    height: min(500px, 80vh);
    background: var(--dark);
    border: 2px solid var(--cyan);
    box-shadow: var(--glow-strong), 0 0 80px rgba(0,229,255,0.2);
    z-index: 200;
    display: none;
    flex-direction: column;
    opacity: 0;
    transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
  }
  .map-panel.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    display: flex;
  }

  .map-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,229,255,0.05);
  }
  .map-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
  }
  .map-close {
    background: none;
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--cyan);
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.2s;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  }
  .map-close:hover {
    background: rgba(0,229,255,0.1);
    border-color: var(--cyan);
    box-shadow: var(--glow);
  }

  #map {
    flex: 1;
    filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(1.1);
  }

  .map-coords {
    padding: 8px 18px;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    opacity: 0.6;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }

  /* COMMANDS HINT */
  .commands-hint {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 50;
  }
  .cmd-chip {
    font-size: 0.5rem;
    letter-spacing: 0.2em;
    opacity: 0.35;
    border: 1px solid rgba(0,229,255,0.2);
    padding: 4px 10px;
    text-transform: uppercase;
    transition: opacity 0.3s;
  }
  .cmd-chip:hover { opacity: 0.7; }

  /* OVERLAY for map */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(2,8,18,0.7);
    z-index: 150;
    display: none;
    backdrop-filter: blur(4px);
  }
  .overlay.visible { display: block; }

  /* CLOCK */
  .clock {
    position: fixed;
    top: 30px;
    right: 70px;
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    opacity: 0.5;
    z-index: 50;
  }

  /* NOTIFICATIONS */
  .notif {
    position: fixed;
    top: 120px;
    right: 30px;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    max-width: 200px;
    padding: 10px 14px;
    background: rgba(0,229,255,0.05);
    border-left: 2px solid var(--cyan);
    box-shadow: var(--glow);
    opacity: 0;
    transform: translateX(20px);
    transition: all 0.4s;
    z-index: 100;
  }
  .notif.show {
    opacity: 1;
    transform: translateX(0);
  }
  .notif.error { border-left-color: #ff3d71; color: #ff3d71; }
  .notif.success { border-left-color: #00e676; color: #00e676; }

  /* MIC PERMISSION */
  .mic-btn {
    display: none;
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,229,255,0.1);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    padding: 10px 24px;
    cursor: pointer;
    z-index: 50;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    transition: all 0.3s;
  }
  .mic-btn:hover {
    background: rgba(0,229,255,0.2);
    box-shadow: var(--glow);
  }
  .mic-btn.visible { display: block; }

  @media (max-width: 600px) {
    .side-panel { display: none; }
    .ring-1 { width: 320px; height: 320px; }
    .ring-2 { width: 270px; height: 270px; }
    .ring-3 { width: 230px; height: 230px; }
    .main-circle { width: 170px; height: 170px; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="header">
  <h1>J.A.R.V.I.S</h1>
  <div class="subtitle">Just A Rather Very Intelligent System — v4.1.7</div>
</div>

<div class="clock" id="clock">00:00:00</div>

<div class="status-bar">
  <div class="status-item"><div class="status-dot green"></div> SYSTÈME ACTIF</div>
  <div class="status-item"><div class="status-dot" id="mic-dot"></div> <span id="mic-status">MIC</span></div>
  <div class="status-item"><div class="status-dot red"></div> SÉCURISÉ</div>
</div>

<!-- LEFT PANEL -->
<div class="side-panel left">
  <div class="panel-block">
    <div class="panel-label">Mode</div>
    <div class="panel-value" id="mode-val">VEILLE</div>
  </div>
  <div class="panel-block">
    <div class="panel-label">Signal</div>
    <div class="panel-value" id="signal-val">—</div>
  </div>
  <div class="panel-block">
    <div class="panel-label">Commandes</div>
    <div class="panel-value" id="cmd-count">0</div>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="side-panel right">
  <div class="panel-block" style="text-align:right">
    <div class="panel-label">Latitude</div>
    <div class="panel-value" id="lat-val">—</div>
  </div>
  <div class="panel-block" style="text-align:right">
    <div class="panel-label">Longitude</div>
    <div class="panel-value" id="lng-val">—</div>
  </div>
  <div class="panel-block" style="text-align:right">
    <div class="panel-label">Précision</div>
    <div class="panel-value" id="acc-val">—</div>
  </div>
</div>

<!-- CENTER CIRCLE -->
<div class="center-stage">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>

  <div class="main-circle" id="mainCircle">
    <div class="arc-decor"></div>
    <div class="circle-icon" id="circleIcon">🎙</div>
    <div class="waveform" id="waveform">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <div class="circle-state-text" id="stateText">EN ATTENTE</div>
  </div>
</div>

<!-- TRANSCRIPT -->
<div class="transcript-area">
  <div class="transcript-label">◈ RECONNAISSANCE VOCALE ◈</div>
  <div class="transcript-text" id="transcriptText">Dites une commande…</div>
</div>

<!-- NOTIFICATION -->
<div class="notif" id="notif"></div>

<!-- MIC BUTTON (fallback) -->
<button class="mic-btn" id="micBtn" onclick="startRecognition()">◈ ACTIVER LE MICROPHONE ◈</button>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeMap()"></div>

<!-- MAP PANEL -->
<div class="map-panel" id="mapPanel">
  <div class="map-header">
    <div class="map-title">◈ LOCALISATION — SYSTÈME GPS ◈</div>
    <button class="map-close" onclick="closeMap()">✕ FERMER</button>
  </div>
  <div id="map"></div>
  <div class="map-coords">
    <span id="coordDisplay">Acquisition des coordonnées…</span>
    <span id="accuracyDisplay"></span>
  </div>
</div>

<script>
// ===================== CLOCK =====================
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m + ':' + s;
}
setInterval(updateClock, 1000);
updateClock();

// ===================== STATE =====================
let map = null;
let marker = null;
let cmdCount = 0;
let isListening = false;
let recognition = null;

// = ===================== UI HELPERS =====================
function setCircleState(state) {
  const circle = document.getElementById('mainCircle');
  const icon = document.getElementById('circleIcon');
  const txt = document.getElementById('stateText');
  const wave = document.getElementById('waveform');
  const modeVal = document.getElementById('mode-val');

  circle.className = 'main-circle';
  wave.className = 'waveform';

  if (state === 'listening') {
    circle.classList.add('listening');
    wave.classList.add('active');
    icon.textContent = '🎙';
    txt.textContent = 'ÉCOUTE';
    modeVal.textContent = 'ÉCOUTE';
    document.getElementById('mic-dot').className = 'status-dot green';
    document.getElementById('mic-status').textContent = 'ACTIF';
  } else if (state === 'processing') {
    circle.classList.add('processing');
    icon.textContent = '⚙';
    txt.textContent = 'TRAITEMENT';
    modeVal.textContent = 'TRAITEMENT';
  } else if (state === 'speaking') {
    circle.classList.add('speaking');
    wave.classList.add('active');
    icon.textContent = '📡';
    txt.textContent = 'RÉPONSE';
    modeVal.textContent = 'RÉPONSE';
  } else {
    icon.textContent = '🎙';
    txt.textContent = 'EN ATTENTE';
    modeVal.textContent = 'VEILLE';
    document.getElementById('mic-dot').className = 'status-dot';
    document.getElementById('mic-status').textContent = 'VEILLE';
  }
}

function setTranscript(text, isResponse = false) {
  const el = document.getElementById('transcriptText');
  el.textContent = text;
  el.className = 'transcript-text' + (isResponse ? ' response' : '');
}

function showNotif(text, type = '') {
  const el = document.getElementById('notif');
  el.textContent = text;
  el.className = 'notif ' + type;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3500);
}

function updateSignal() {
  const bars = ['▁▂▃▄▅', '▁▂▃▄', '▁▂▃', '▁▂▃▄▅'];
  document.getElementById('signal-val').textContent = bars[Math.floor(Math.random()*4)];
}
setInterval(updateSignal, 2000);

// ===================== SPEECH SYNTHESIS =====================
let isSpeaking = false;

function speak(text) {
  if (!window.speechSynthesis) return;
  try { window.speechSynthesis.cancel(); } catch(e) {}
  isSpeaking = false;

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'fr-FR';
  utter.rate = 1.0;
  utter.pitch = 0.9;
  utter.volume = 1;

  utter.onstart = () => {
    isSpeaking = true;
    setCircleState('speaking');
  };
  utter.onend = () => {
    isSpeaking = false;
    setCircleState('listening');
    setTranscript('Dites une commande…');
    setTimeout(startRecognition, 500);
  };
  utter.onerror = () => {
    isSpeaking = false;
    setCircleState('listening');
    setTimeout(startRecognition, 500);
  };

  try {
    window.speechSynthesis.speak(utter);
  } catch(e) {
    isSpeaking = false;
  }
}

// ===================== MAP =====================
function initMap(lat, lng, accuracy) {
  const mapPanel = document.getElementById('mapPanel');
  const overlay = document.getElementById('overlay');

  mapPanel.style.display = 'flex';
  overlay.classList.add('visible');

  setTimeout(() => mapPanel.classList.add('visible'), 10);

  if (!map) {
    map = L.map('map', { zoomControl: true, attributionControl: false }).setView([lat, lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);
  } else {
    map.setView([lat, lng], 15);
  }

  if (marker) {
    marker.setLatLng([lat, lng]);
  } else {
    const icon = L.divIcon({
      html: `<div style="
        width:16px;height:16px;
        background:rgba(0,229,255,0.9);
        border:2px solid #00e5ff;
        border-radius:50%;
        box-shadow:0 0 15px rgba(0,229,255,0.8);
      "></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8],
      className: ''
    });
    marker = L.marker([lat, lng], { icon }).addTo(map);
  }

  L.circle([lat, lng], {
    radius: accuracy || 50,
    color: 'rgba(0,229,255,0.5)',
    fillColor: 'rgba(0,229,255,0.05)',
    fillOpacity: 0.3
  }).addTo(map);

  document.getElementById('coordDisplay').textContent =
    `LAT: ${lat.toFixed(6)} | LNG: ${lng.toFixed(6)}`;
  document.getElementById('accuracyDisplay').textContent =
    `PRÉCISION: ±${Math.round(accuracy || 0)}m`;

  document.getElementById('lat-val').textContent = lat.toFixed(5);
  document.getElementById('lng-val').textContent = lng.toFixed(5);
  document.getElementById('acc-val').textContent = '±' + Math.round(accuracy || 0) + 'm';

  setTimeout(() => { if(map) map.invalidateSize(); }, 300);
}

function closeMap() {
  const mapPanel = document.getElementById('mapPanel');
  const overlay = document.getElementById('overlay');
  mapPanel.classList.remove('visible');
  overlay.classList.remove('visible');
  setTimeout(() => { mapPanel.style.display = 'none'; }, 500);
}

function localize() {
  setCircleState('processing');
  setTranscript('Acquisition des coordonnées GPS…');
  speak('Localisation en cours. Acquisition des coordonnées GPS.');

  if (!navigator.geolocation) {
    speak('Désolé, la géolocalisation n\'est pas disponible sur cet appareil.');
    setTranscript('Géolocalisation non disponible', false);
    setCircleState('listening');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      cmdCount++;
      document.getElementById('cmd-count').textContent = cmdCount;

      speak(`Position localisée. Latitude ${lat.toFixed(4)}, longitude ${lng.toFixed(4)}. Précision ${Math.round(acc)} mètres.`);
      setTranscript(`Position : ${lat.toFixed(5)}, ${lng.toFixed(5)}`, true);
      showNotif('✓ Localisation réussie', 'success');

      setTimeout(() => initMap(lat, lng, acc), 800);
    },
    (err) => {
      let msg = 'Impossible de vous localiser.';
      if (err.code === 1) msg = 'Permission de localisation refusée.';
      else if (err.code === 2) msg = 'Position indisponible.';
      else if (err.code === 3) msg = 'Délai de localisation dépassé.';
      speak(msg);
      setTranscript(msg, false);
      showNotif('✗ ' + msg, 'error');
      setCircleState('listening');
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
}

// ===================== COMMAND PROCESSING =====================
function processCommand(text) {
  const t = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  setCircleState('processing');
  setTranscript(text);
  cmdCount++;
  document.getElementById('cmd-count').textContent = cmdCount;

  if (/(localis|position|ou suis|gps|carte|map|coordon)/.test(t)) {
    localize();
  } else if (/(ferme|cache|quitte|close|retour|back).*(carte|map)/.test(t) ||
             /(carte|map).*(ferme|cache|close)/.test(t)) {
    closeMap();
    speak('Carte fermée.');
    setTranscript('Carte fermée', true);
    setCircleState('listening');
  } else if (/(heure|time|quelle heureest t'il|horloge)/.test(t)) {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const rep = `Il est ${h} heure${h > 1 ? 's' : ''} ${m > 0 ? 'et ' + m + ' minute' + (m > 1 ? 's' : '') : ''}.`;
    speak(rep);
    setTranscript(rep, true);
    setCircleState('listening');
  } else if (/(statut|status|systeme|etat|diagnostic)/.test(t)) {
    speak('Tous les systèmes sont opérationnels. Reconnaissance vocale active. Connexion réseau établie.');
    setTranscript('Tous systèmes nominaux', true);
    setCircleState('listening');
  } else if (/(bonjour|salut|hello|hey jarvis|bonsoir)/.test(t)) {
    speak('Bonjour. Je suis JARVIS., à votre service.');
    setTranscript('Bonjour.', true);
    setCircleState('listening');
  } else if (/(merci|thank)/.test(t)) {
    speak('Je vous en prie. Comment puis-je vous aider davantage ?');
    setTranscript('Je vous en prie.', true);
    setCircleState('listening');
  } else if (/(meteo|temps|temperature|pluie|soleil)/.test(t)) {
    speak('Je n\'ai pas accès aux données météo en temps réel. Activez la localisation pour une meilleure analyse.');
    setTranscript('Données météo non disponibles', true);
    setCircleState('listening');
  } else {
    speak(`Commande non reconnue : ${text}.`);
    setTranscript('Commande inconnue : ' + text, false);
    setCircleState('listening');
  }
}

// ===================== SPEECH RECOGNITION =====================
function startRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showNotif('✗ Reconnaissance vocale non supportée', 'error');
    setTranscript('Navigateur non compatible. Utilisez Chrome.', false);
    return;
  }

  if (isListening || isSpeaking) return;

  if (recognition) {
    try { recognition.abort(); } catch(e) {}
    recognition = null;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'fr-FR';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    setCircleState('listening');
    document.getElementById('micBtn').classList.remove('visible');
    if (!window._micStarted) {
      window._micStarted = true;
      showNotif('◈ Microphone actif', '');
    }
  };

  recognition.onresult = (event) => {
    let interim = '';
    let final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        final += event.results[i][0].transcript;
      } else {
        interim += event.results[i][0].transcript;
      }
    }
    if (interim) setTranscript(interim + '…');
    if (final.trim()) {
      isListening = false;
      try { recognition.stop(); } catch(e) {}
      setTranscript(final.trim());
      processCommand(final.trim());
    }
  };

  recognition.onerror = (event) => {
    if (event.error === 'not-allowed') {
      showNotif('✗ Microphone refusé', 'error');
      setTranscript('Autorisation microphone requise.', false);
      document.getElementById('micBtn').classList.add('visible');
      setCircleState('idle');
      isListening = false;
      return;
    }
    isListening = false;
    if (!isSpeaking) setTimeout(startRecognition, 1000);
  };

  recognition.onend = () => {
    isListening = false;
    if (!isSpeaking) setTimeout(startRecognition, 600);
  };

  try {
    recognition.start();
  } catch(e) {
    isListening = false;
    setTimeout(startRecognition, 1200);
  }
}

// ===================== INIT =====================
window.addEventListener('load', () => {
  setCircleState('idle');
  setTimeout(() => {
    setTranscript('Initialisation…', true);
    const trySpeak = () => {
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      if (voices.length > 0 || !window.speechSynthesis) {
        speak('J.A.R.V.I.S. en ligne. Systèmes initialisés. En attente de vos instructions.');
      } else {
        setTimeout(trySpeak, 200);
      }
    };
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = trySpeak;
      trySpeak();
    } else {
      setTimeout(startRecognition, 500);
    }
  }, 600);
});

// Clicking the circle also restarts listening
document.getElementById('mainCircle').addEventListener('click', () => {
  if (!isListening) {
    speak('Redémarrage de l\'écoute.');
    setTimeout(startRecognition, 800);
  }
});
